name: PlotNameAI

options:
  bundleIdPrefix: com.plotname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: ja
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad（ユニバーサル）
    SWIFT_STRICT_CONCURRENCY: minimal

# CI(xcodebuild)から使えるよう shared スキームを生成する。
schemes:
  PlotNameAI:
    build:
      targets:
        PlotNameAI: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  PlotNameAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PlotNameAI
        excludes:
          - "Resources/Info.plist"   # INFOPLIST_FILE で参照するためコピー対象から除外
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plotname.ai
        PRODUCT_NAME: PlotNameAI
        INFOPLIST_FILE: PlotNameAI/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
