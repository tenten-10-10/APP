<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タナミル チーム｜近日公開</title>
<meta name="description" content="タナミルのチーム共有プラン。詳細は近日公開します。">
<meta name="robots" content="noindex">
<style>
:root{--olive:#4c5a2e;--olive-2:#6e7c48;--olive-deep:#3c4826;--paper:#fbfbf7;--ink:#1d2417;--muted:#5b6450;--line:#e6e8dd}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--ink);background:var(--paper);line-height:1.9;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--olive-2),var(--olive-deep));color:#fff;padding:64px 22px 72px;text-align:center;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 400px at 80% -10%,rgba(255,255,255,.14),transparent 60%)}
header .in{position:relative;z-index:2}
.tag{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:999px;
  padding:5px 18px;font-size:13px;font-weight:700;letter-spacing:.08em;margin-bottom:18px}
h1{margin:0;font-size:clamp(28px,5vw,42px);font-weight:800}
header p{margin:14px auto 0;max-width:32em;opacity:.94}
main{flex:1;max-width:760px;margin:0 auto;padding:56px 22px;text-align:center}
.soon{font-size:15px;color:var(--muted)}
.dots{display:inline-flex;gap:10px;margin:26px 0 8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--olive);opacity:.25;animation:b 1.6s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
a.back{display:inline-block;margin-top:30px;color:var(--olive);font-weight:700}
footer{border-top:1px solid var(--line);padding:22px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--olive)}
</style>
</head>
<body>
<header><div class="in">
  <span class="tag">TANAMIRU TEAM</span>
  <h1>タナミル チーム</h1>
  <p>プロジェクトを共有して、チームみんなで同じ在庫を管理するためのプランです。</p>
</div></header>
<main>
  <div class="dots"><i></i><i></i><i></i></div>
  <h2 style="margin:6px 0 10px">詳細は近日公開</h2>
  <p class="soon">プランの内容・料金のご案内を準備しています。<br>公開までしばらくお待ちください。</p>
  <a class="back" href="./index.html">← 使い方ガイドへ戻る</a>
</main>
<footer>© 2026 tanamiru ／ <a href="../index.html">サポート</a> ／ <a href="../privacy.html">プライバシーポリシー</a></footer>
</body>
</html>
